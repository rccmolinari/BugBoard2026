# Profilo "docker": attivo nell'immagine container (SPRING_PROFILES_ACTIVE=docker).
# NON contiene segreti: le credenziali del DB arrivano da variabili d'ambiente,
# iniettate a runtime (docker compose / .env sul server). Se le env mancano,
# Spring NON parte: fail-fast voluto, meglio di un default sbagliato in produzione.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Lo schema sul DB remoto e' gestito a mano: validate non crea/altera colonne.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Upload immagini delle issue (deve combaciare col limite del reverse proxy nginx).
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
