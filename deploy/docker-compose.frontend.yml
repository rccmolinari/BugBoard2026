# Gira sul SERVER FRONTEND. La pipeline lo copia in /opt/bugboard/docker-compose.yml
# e lancia: docker compose pull && docker compose up -d
#
# /opt/bugboard/.env sul server contiene l'indirizzo del backend:
#   BACKEND_URL=http://<IP_O_HOST_DEL_BACKEND>:8080
services:
  frontend:
    image: ghcr.io/rccmolinari/bugboard2026/frontend:latest
    container_name: bugboard-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - "80:80"
      # - "443:443"   # quando aggiungi TLS (vedi DEPLOY.md)
